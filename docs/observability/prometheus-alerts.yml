groups:
  - name: unidocs-auth
    rules:
      - alert: AuthHttpServerFailures
        expr: |
          (sum by (service, environment) (rate(http_server_requests_seconds_count{service="auth-service",status=~"5.."}[5m]))
          / clamp_min(sum by (service, environment) (rate(http_server_requests_seconds_count{service="auth-service"}[5m])), 0.001) > 0.05)
          and on (service, environment)
          (sum by (service, environment) (increase(http_server_requests_seconds_count{service="auth-service"}[5m])) >= 20)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Auth HTTP server failures exceed 5 percent
      - alert: AuthHttpSlow
        expr: |
          histogram_quantile(0.95, sum by (le, service, environment)
          (rate(http_server_requests_seconds_bucket{service="auth-service"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Auth HTTP p95 exceeds one second
      - alert: AuthOutboxStalled
        expr: |
          (max by (service, environment) (outbox_oldest_pending_age_seconds{service="auth-service"}) > 300)
          and on (service, environment)
          (sum by (service, environment) (outbox_pending_count{service="auth-service"}) > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Auth pending outbox events are older than five minutes
      - alert: AuthOutboxRetries
        expr: |
          sum by (service, environment) (increase(outbox_delivery_total{service="auth-service",outcome="retry"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Auth outbox publishing repeatedly retries
      - alert: AuthRedisSnapshotFailures
        expr: |
          sum by (service, environment) (increase(authorization_snapshot_total{service="auth-service",outcome="redis_unavailable"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IAM Redis snapshot operations repeatedly fail
      - alert: AuthAuditPersistenceFailure
        expr: |
          sum by (service, environment) (increase(audit_persistence_total{service="auth-service",outcome="failed"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Auth audit persistence failed and security transactions were rejected
      - alert: AuthMetricsTargetDown
        expr: up{job="unidocs-auth"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Auth private metrics target is unavailable
      - alert: AuthLoginFailures
        expr: |
          (sum by (service, environment) (rate(authentication_login_total{service="auth-service",outcome="failed"}[5m]))
          / clamp_min(sum by (service, environment) (rate(authentication_login_total{service="auth-service"}[5m])), 0.001) > 0.5)
          and on (service, environment)
          (sum by (service, environment) (increase(authentication_login_total{service="auth-service"}[5m])) >= 20)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Auth login failures exceed 50 percent
