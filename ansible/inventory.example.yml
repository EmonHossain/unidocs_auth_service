---
all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_PRIVATE_KEY') }}"
    ansible_python_interpreter: /usr/bin/python3
    aws_region: eu-central-1
  children:
    auth:
      hosts:
        auth-prod-1: {ansible_host: 10.0.10.11, service_key: auth}
    document:
      hosts:
        document-prod-1: {ansible_host: 10.0.10.12, service_key: document}
    frontend:
      hosts:
        frontend-prod-1: {ansible_host: 10.0.10.13, service_key: frontend}
    mysql:
      hosts:
        mysql-prod-1: {ansible_host: 10.0.20.11, service_key: mysql}
    redis:
      hosts:
        redis-prod-1: {ansible_host: 10.0.20.12, service_key: redis}
    kafka:
      hosts:
        kafka-prod-1: {ansible_host: 10.0.20.13, service_key: kafka}
    elasticsearch:
      hosts:
        elasticsearch-prod-1: {ansible_host: 10.0.20.14, service_key: elasticsearch}
    spicedb:
      hosts:
        spicedb-prod-1: {ansible_host: 10.0.20.15, service_key: spicedb}
    student_evidence:
      hosts:
        student-evidence-prod-1: {ansible_host: 10.0.20.16, service_key: student-evidence}
    keycloak:
      hosts:
        keycloak-prod-1: {ansible_host: 10.0.30.11, service_key: keycloak}
    prometheus:
      hosts:
        prometheus-prod-1: {ansible_host: 10.0.30.12, service_key: prometheus}
    grafana:
      hosts:
        grafana-prod-1: {ansible_host: 10.0.30.13, service_key: grafana}
    kibana:
      hosts:
        kibana-prod-1: {ansible_host: 10.0.30.14, service_key: kibana}
    apm_server:
      hosts:
        apm-server-prod-1: {ansible_host: 10.0.30.15, service_key: apm-server}
    filebeat:
      hosts:
        filebeat-prod-1: {ansible_host: 10.0.30.16, service_key: filebeat}
    virus_scanner:
      hosts:
        virus-scanner-prod-1: {ansible_host: 10.0.30.17, service_key: virus-scanner}
