---
- name: Deploy selected UniDocs service on AWS EC2
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  vars:
    service_key: "{{ hostvars[inventory_hostname].service_key }}"
    compose_path: "{{ deployment_root }}/{{ service_key }}/compose.yml"
    service_directory: "{{ deployment_root }}/{{ service_key }}"
    deployment_artifact: "{{ playbook_dir }}/artifacts/{{ service_key }}/"
    os_packages:
      Debian: [docker.io, python3, ca-certificates, curl]
      RedHat: [docker, python3, ca-certificates, curl]

  pre_tasks:
    - name: Verify supported Linux platform and private VPC address
      ansible.builtin.assert:
        that:
          - ansible_os_family in os_packages
          - ansible_host is match('^(10\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|192\\.168\\.)')
          - service_key in service_artifact_paths
        fail_msg: "Host must be a supported Linux EC2 instance with a private address and known service mapping."

  tasks:
    - name: Install Docker and operating system prerequisites
      ansible.builtin.package:
        name: "{{ os_packages[ansible_os_family] }}"
        state: present

    - name: Create Docker CLI plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Docker Compose plugin
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        owner: root
        group: root
        mode: '0755'

    - name: Enable Docker daemon
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create service deployment directory
      ansible.builtin.file:
        path: "{{ service_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Deploy versioned service files
      ansible.builtin.copy:
        src: "{{ deployment_artifact }}"
        dest: "{{ service_directory }}/"
        owner: root
        group: root
        mode: preserve

    - name: Retrieve service secrets from AWS Systems Manager Parameter Store
      amazon.aws.aws_ssm:
        name: "{{ aws_ssm_parameter_names[service_key] }}"
        region: "{{ aws_region }}"
        decrypt: true
      register: service_env
      delegate_to: localhost
      become: false
      no_log: true
      when: service_key in aws_ssm_parameter_names

    - name: Write service environment securely
      ansible.builtin.copy:
        content: "{{ service_env.value }}\n"
        dest: "{{ service_directory }}/.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when: service_key in aws_ssm_parameter_names

    - name: Validate Docker Compose model
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - unidocs
          - --file
          - "{{ compose_path }}"
          - config
          - --quiet
      args:
        chdir: "{{ service_directory }}"
      changed_when: false

    - name: Reconcile service containers
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - unidocs
          - --file
          - "{{ compose_path }}"
          - up
          - --detach
          - --remove-orphans
      args:
        chdir: "{{ service_directory }}"
      register: compose_result
      changed_when: compose_result.stdout is search('Creating|Recreating|Starting|Started|Pulled|Built')
