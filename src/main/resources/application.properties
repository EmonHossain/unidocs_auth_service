spring.application.name=auth-service
api.version.base-path=/api/v1
auth.jwt.issuer=${JWT_ISSUER:urn:unidocs:auth}
auth.jwt.audience=${JWT_AUDIENCE:urn:unidocs:drive}
auth.jwt.active-kid=${JWT_ACTIVE_KID}
auth.jwt.private-key=${JWT_PRIVATE_KEY}
auth.jwt.public-key=${JWT_PUBLIC_KEY}
auth.jwt.retained-public-keys=${JWT_RETAINED_PUBLIC_KEYS:}

# Separate service identity trust; user access tokens cannot authenticate this route.
auth.internal-authorization.enabled=${INTERNAL_AUTHORIZATION_ENABLED:false}
auth.internal-authorization.issuer=${INTERNAL_AUTHORIZATION_ISSUER:}
auth.internal-authorization.audience=${INTERNAL_AUTHORIZATION_AUDIENCE:}
auth.internal-authorization.jwk-set-uri=${INTERNAL_AUTHORIZATION_JWK_SET_URI:}
auth.internal-authorization.service-subjects=${INTERNAL_AUTHORIZATION_SERVICE_SUBJECTS:}

spring.datasource.url=${DB_URL:jdbc:mysql://${SHARED_MYSQL_HOST:localhost}:${SHARED_MYSQL_PORT:3306}/${DB_NAME:auth_service}?${DB_URL_OPTIONS:connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Disposable infrastructure. Permission projections require versioned invalidation before use.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
spring.kafka.properties.request.timeout.ms=5000
spring.kafka.properties.default.api.timeout.ms=5000
spring.kafka.properties.allow.auto.create.topics=false
spring.cache.type=caffeine
spring.cache.caffeine.spec=${CAFFEINE_SPEC:maximumSize=10000,expireAfterWrite=30s,recordStats}

auth.outbox.enabled=${OUTBOX_ENABLED:false}
auth.outbox.scheduling-enabled=true
auth.outbox.topic=${OUTBOX_TOPIC:iam.domain-events.v1}
auth.outbox.batch-size=20
auth.outbox.lease-duration=60s
auth.outbox.send-timeout=20s
auth.outbox.retry-initial=1s
auth.outbox.retry-max=5m
auth.outbox.poll-interval=5000
auth.authorization.cache.enabled=${AUTHORIZATION_CACHE_ENABLED:false}
auth.authorization.cache.listener-enabled=${AUTHORIZATION_CACHE_LISTENER_ENABLED:false}
auth.authorization.cache.instance-id=${AUTHORIZATION_CACHE_INSTANCE_ID:${random.uuid}}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

spring.mvc.problemdetails.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=${AUTH_INFRASTRUCTURE_ENABLED:false}
management.health.kafka.enabled=${AUTH_INFRASTRUCTURE_ENABLED:false}
management.health.mail.enabled=${ACCOUNT_NOTICE_SMTP_ENABLED:false}

logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.mail=OFF
logging.level.org.eclipse.angus.mail=OFF
# ECS JSON goes to stdout by default; prod uses files collected by Filebeat.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${AUTH_SERVICE_VERSION:0.0.1-SNAPSHOT}
logging.structured.ecs.service.environment=${AUTH_SERVICE_ENVIRONMENT:dev}
logging.level.root=${AUTH_LOG_LEVEL:INFO}
management.otlp.metrics.export.enabled=false
logging.level.com.unidocs.auth=${AUTH_LOG_LEVEL:INFO}
logging.structured.json.rename.requestId=http.request.id
# Throwable messages and stacks may contain JDBC values, URLs or credentials.
logging.structured.json.exclude=error.message,error.stack_trace

registration.delivery.smtp.enabled=${REGISTRATION_SMTP_ENABLED:false}
registration.delivery.smtp.from=${REGISTRATION_SMTP_FROM:}

organization.invitation.smtp.enabled=${ORGANIZATION_INVITATION_SMTP_ENABLED:false}
organization.invitation.smtp.from=${ORGANIZATION_INVITATION_SMTP_FROM:}

auth.account-lifecycle.retention-months=${ACCOUNT_RETENTION_MONTHS:3}
auth.account-lifecycle.maintenance-enabled=${ACCOUNT_LIFECYCLE_MAINTENANCE_ENABLED:true}
auth.account-lifecycle.smtp-enabled=${ACCOUNT_NOTICE_SMTP_ENABLED:false}
auth.account-lifecycle.mail-from=${ACCOUNT_NOTICE_SMTP_FROM:no-reply@unidocs.local}

# Admission evidence stays private in S3-compatible object storage, outside MySQL.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
registration.student.storage.enabled=${STUDENT_STORAGE_ENABLED:false}
registration.student.storage.endpoint=${STUDENT_STORAGE_ENDPOINT:${SHARED_STORAGE_ENDPOINT:http://localhost:9000}}
registration.student.storage.bucket=${STUDENT_STORAGE_BUCKET:student-evidence}
registration.student.storage.create-bucket=${STUDENT_STORAGE_CREATE_BUCKET:false}
registration.student.storage.access-key=${STUDENT_STORAGE_ACCESS_KEY:}
registration.student.storage.secret-key=${STUDENT_STORAGE_SECRET_KEY:}

# Separate purpose-bound password recovery delivery.
auth.password-recovery.email-enabled=${PASSWORD_RECOVERY_EMAIL_ENABLED:false}
auth.password-recovery.mail-from=${AUTH_PASSWORD_RECOVERY_MAIL_FROM:${registration.delivery.smtp.from}}

# Login admission is distributed, expires automatically and fails closed when Redis is unavailable.
auth.login-protection.enabled=${LOGIN_ATTACK_PROTECTION_ENABLED:true}
auth.login-protection.key-prefix=${LOGIN_ATTACK_PROTECTION_KEY_PREFIX:auth:login:v1}
auth.login-protection.window=${LOGIN_ATTACK_PROTECTION_WINDOW:15m}
auth.login-protection.ip-limit=${LOGIN_ATTACK_PROTECTION_IP_LIMIT:50}
auth.login-protection.account-limit=${LOGIN_ATTACK_PROTECTION_ACCOUNT_LIMIT:10}
auth.login-protection.pair-limit=${LOGIN_ATTACK_PROTECTION_PAIR_LIMIT:5}
# Resolve login source from the socket peer; forwarding headers are untrusted.
server.forward-headers-strategy=none

# Endpoint request admission counts every attempt independently of login failure state.
auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
auth.rate-limit.key-prefix=${AUTH_RATE_LIMIT_KEY_PREFIX:auth:rate:v1}
auth.rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:1m}
auth.rate-limit.registration-limit=${AUTH_RATE_LIMIT_REGISTRATION_LIMIT:10}
auth.rate-limit.login-limit=${AUTH_RATE_LIMIT_LOGIN_LIMIT:60}
auth.rate-limit.refresh-limit=${AUTH_RATE_LIMIT_REFRESH_LIMIT:120}
auth.rate-limit.forgot-password-limit=${AUTH_RATE_LIMIT_FORGOT_PASSWORD_LIMIT:10}
auth.rate-limit.reset-password-limit=${AUTH_RATE_LIMIT_RESET_PASSWORD_LIMIT:20}
auth.rate-limit.verification-limit=${AUTH_RATE_LIMIT_VERIFICATION_LIMIT:20}

# Browser refresh transport is opt-in per request; explicit HTTPS origins enable it.
auth.browser-refresh.allowed-origins=${AUTH_BROWSER_REFRESH_ALLOWED_ORIGINS:}

# Boot-managed Micrometer/OpenTelemetry; deployment opts into its actual APM receiver.
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=${AUTH_TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.baggage.enabled=false
management.tracing.baggage.correlation.enabled=false
management.tracing.export.otlp.enabled=${AUTH_OTLP_TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${AUTH_OTLP_TRACING_ENDPOINT:${SHARED_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.connect-timeout=1s
management.opentelemetry.tracing.export.otlp.timeout=1s
management.opentelemetry.tracing.export.max-queue-size=1024
management.opentelemetry.tracing.export.max-batch-size=256
management.opentelemetry.tracing.export.schedule-delay=5s
management.opentelemetry.tracing.export.timeout=2s
management.opentelemetry.tracing.limits.max-attributes=64
management.opentelemetry.tracing.limits.max-attribute-value-length=256
management.opentelemetry.tracing.limits.max-events=16
management.opentelemetry.tracing.limits.max-links=16
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.service.version=${AUTH_SERVICE_VERSION:0.0.1-SNAPSHOT}
management.opentelemetry.resource-attributes.deployment.environment.name=${AUTH_SERVICE_ENVIRONMENT:dev}
# Diagnostic logs use ECS stdout/files; no second OTLP log pipeline.
management.logging.export.enabled=false
logging.structured.json.rename.traceId=trace.id
logging.structured.json.rename.spanId=span.id
spring.kafka.listener.observation-enabled=true
spring.task.execution.propagate-context=true

# Metrics use deployment labels and bounded route templates, never request identity.
management.metrics.tags.service=${spring.application.name}
management.metrics.tags.environment=${AUTH_SERVICE_ENVIRONMENT:dev}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
auth.outbox.audit-topic=${AUDIT_OUTBOX_TOPIC:iam.security-audit.v1}

# Interactive API documentation is opt-in; disable on public production deployments.
springdoc.api-docs.enabled=${AUTH_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${AUTH_API_DOCS_ENABLED:false}
springdoc.paths-to-exclude=${api.version.base-path}/internal/**,/actuator/**,/error
springdoc.packages-to-scan=com.unidocs.auth
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=false
