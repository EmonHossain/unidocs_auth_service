# Opt-in private metrics listener. Supply a random URL-safe token through secrets/environment.
management.server.port=9091
management.server.address=127.0.0.1
management.endpoint.health.probes.add-additional-paths=true
auth.management.scrape.enabled=true
auth.management.scrape.token=${AUTH_METRICS_SCRAPE_TOKEN:}
auth.management.scrape.allow-private-network=${AUTH_MANAGEMENT_SCRAPE_ALLOW_PRIVATE_NETWORK:false}
