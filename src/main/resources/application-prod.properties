# Production diagnostics go to Filebeat's structured file input, never the console.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.main.banner-mode=off
spring.output.ansi.enabled=never
server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.ssl.key-store=file:/run/secrets/application/auth-local-tls.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${AUTH_TLS_STORE_PASSWORD}
management.server.ssl.enabled=false
logging.console.enabled=false
logging.file.name=/var/log/unidocs/auth-service.log
logging.structured.format.file=ecs
logging.level.root=INFO
logging.level.com.unidocs.auth=INFO
logging.structured.ecs.service.environment=prod
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.file-name-pattern=/var/log/unidocs/auth-service.log.%d{yyyy-MM-dd}.%i
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
