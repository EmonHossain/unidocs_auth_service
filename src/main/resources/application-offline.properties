# Diagnostic startup with no infrastructure, credentials or signing keys.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.health.mail.enabled=false
management.endpoint.health.group.readiness.include=readinessState
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
