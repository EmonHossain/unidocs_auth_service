global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: unidocs-auth
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics/scrape-token
    static_configs:
      - targets: ['127.0.0.1:9091']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

